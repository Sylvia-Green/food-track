  button, input { font: inherit; }
  .app { width: min(100%, 620px); margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  .hero { padding: 14px 4px 16px; text-shadow: 0 2px 16px rgba(0,0,0,.65); }
  .eyebrow { font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; color: #d3e7ff; font-weight: 800; opacity: .9; }
  h1 { margin: 6px 0 4px; font-size: clamp(1.6rem, 6vw, 2.35rem); line-height: 1.08; }
  .subtitle { margin: 0; color: #e1ebf5; font-size: .95rem; }
  .datebar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .datebar input { flex: 1 1 170px; color: white; background: rgba(4,11,22,.72); border:1px solid var(--line); border-radius:14px; padding:12px 13px; min-height:46px; }
  .pill { border:1px solid var(--line); background: rgba(255,255,255,.08); color:white; border-radius:999px; padding:11px 15px; font-weight:800; cursor:pointer; }
  .pill.active { background:white; color:#0b1422; }
  .view-note { margin: 10px 2px 0; font-size:.86rem; color:#d9e7f5; }

  .grid { display:grid; gap:14px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:24px; padding:18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow:var(--shadow); }
  .card-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
  .card-title { margin:0; font-size:1.05rem; }
  .card-kicker { color:var(--muted); font-size:.8rem; margin-top:2px; }
  .add-btn { border:0; border-radius:999px; padding:10px 13px; background:#f8fbff; color:#0c1523; font-weight:900; cursor:pointer; white-space:nowrap; }
  .add-btn:disabled { opacity:.42; cursor:not-allowed; }
  .inline-form { display:none; grid-template-columns: 1.35fr .8fr auto; gap:8px; margin: 0 0 14px; }
  .inline-form.show { display:grid; }
  .inline-form input { min-width:0; width:100%; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.08); color:white; padding:11px 12px; outline:none; }
  .inline-form input::placeholder { color:#aebdd0; }
  .save-btn { border:0; border-radius:12px; padding:10px 14px; background:#8fe7ad; color:#07130d; font-weight:900; cursor:pointer; }

  .ring-wrap { display:flex; justify-content:center; padding:2px 0 8px; }
  .ring { width:190px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(var(--ring-color) calc(var(--pct) * 1%), rgba(255,255,255,.12) 0); box-shadow:0 0 0 1px rgba(255,255,255,.06), inset 0 0 28px rgba(0,0,0,.25); }
  .ring::after { content:""; position:absolute; inset:13px; border-radius:50%; background:rgba(5,12,23,.94); border:1px solid rgba(255,255,255,.08); }
  .ring-content { position:relative; z-index:1; text-align:center; padding:10px; }
  .ring-main { font-size:2rem; font-weight:950; letter-spacing:-.04em; }
  .ring-label { color:var(--muted); font-size:.82rem; margin-top:4px; }
  .ring-sub { margin-top:6px; font-size:.78rem; font-weight:800; }
  .food-ring { --ring-color: var(--accent); }
  .burn-ring { --ring-color: var(--danger); filter: drop-shadow(0 0 11px rgba(255,93,108,.22)); }

  .entries { display:grid; gap:7px; margin-top:8px; }
  .entry { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 10px; background:rgba(255,255,255,.065); border:1px solid rgba(255,255,255,.08); border-radius:12px; font-size:.88rem; }
  .entry-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-right { display:flex; align-items:center; gap:8px; flex:0 0 auto; font-weight:850; }
  .delete { width:26px; height:26px; border:0; border-radius:50%; background:rgba(255,255,255,.1); color:white; cursor:pointer; font-size:1rem; line-height:1; }
  .empty { text-align:center; color:var(--muted); font-size:.85rem; padding:4px 0; }

  .water-row { display:grid; grid-template-columns: repeat(8, 1fr); gap:8px; margin:12px 0 8px; }
  .glass { position:relative; height:62px; border:2px solid rgba(225,244,255,.64); border-top:0; border-radius:4px 4px 11px 11px; cursor:pointer; overflow:hidden; background:rgba(255,255,255,.03); box-shadow: inset 0 0 10px rgba(255,255,255,.04); }
  .glass::before { content:""; position:absolute; left:6%; right:6%; bottom:0; height:0%; border-radius:4px 4px 8px 8px; background:linear-gradient(180deg, rgba(119,219,255,.88), rgba(53,156,245,.9)); transition:height .25s ease; }
  .glass.full::before { height:82%; }
  .glass.full::after { content:""; position:absolute; left:12%; right:12%; bottom:76%; height:3px; border-radius:999px; background:rgba(228,250,255,.8); }
  .glass.locked { cursor:default; opacity:.9; }
  .water-status { text-align:center; color:#d9edff; font-weight:850; font-size:.88rem; }

  .close-btn { width:100%; margin-top:14px; border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:15px 18px; background:rgba(10,16,26,.88); color:white; font-weight:950; letter-spacing:.01em; cursor:pointer; box-shadow:var(--shadow); }
  .close-btn.closed { background:rgba(255,255,255,.14); color:#d6e0ea; cursor:default; }
  .closed-banner { display:none; margin-top:10px; text-align:center; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.09); border:1px solid var(--line); color:#deebf8; font-size:.87rem; }
  .closed-banner.show { display:block; }
  .tiny { margin:12px 4px 0; color:#b9c9da; font-size:.75rem; line-height:1.45; text-align:center; text-shadow:0 1px 8px rgba(0,0,0,.7); }
  .hidden { display:none !important; }
  @media (max-width: 430px) {
    .app { padding-left:12px; padding-right:12px; }
    .card { padding:15px; border-radius:21px; }
    .ring { width:170px; }
    .ring-main { font-size:1.8rem; }
    .inline-form { grid-template-columns: 1fr .72fr; }
    .save-btn { grid-column:1 / -1; }
    .water-row { gap:6px; }
    .glass { height:56px; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="hero">
    
    <h1>Sane's Personalized<br>Weight Management</h1>
    <div class="datebar">
      <input id="datePicker" type="date" aria-label="Select today or yesterday" />
      <button id="todayBtn" class="pill active" type="button">Today</button>
      <button id="yesterdayBtn" class="pill" type="button">Yesterday</button>
    </div>
    <div id="viewNote" class="view-note"></div>
  </section>

  <section class="grid">
    <article class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">Calories Eaten</h2>
        </div>
        <button id="mealToggle" class="add-btn" type="button">+ Add meal</button>
      </div>
      <form id="mealForm" class="inline-form" autocomplete="off">
        <input id="mealName" type="text" maxlength="60" placeholder="Meal name" required />
        <input id="mealCal" type="number" inputmode="numeric" min="0" step="1" placeholder="Calories" required />
        <button class="save-btn" type="submit">Add</button>
      </form>
      <div class="ring-wrap">
        <div id="foodRing" class="ring food-ring" style="--pct:0">
          <div class="ring-content">
            <div id="foodTotal" class="ring-main">0/1100</div>
            <div class="ring-label">kcal eaten</div>
            <div id="foodRemaining" class="ring-sub">1,100 left</div>
          </div>
        </div>
      </div>
    </article>

    <article class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">Water</h2>
        </div>
      </div>
      <div id="waterRow" class="water-row" aria-label="Eight glasses of water"></div>
      <div id="waterStatus" class="water-status">0/8 glasses</div>
    </article>

    <article class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">Activity</h2>
        </div>
        <button id="activityToggle" class="add-btn" type="button">+ Add activity</button>
      </div>
      <form id="activityForm" class="inline-form" autocomplete="off">
        <input id="activityName" type="text" maxlength="60" placeholder="Activity name" required />
        <input id="activityCal" type="number" inputmode="numeric" min="0" step="1" placeholder="Calories burned" required />
        <button class="save-btn" type="submit">Add</button>
      </form>
      <div class="ring-wrap">
        <div id="burnRing" class="ring burn-ring" style="--pct:0">
          <div class="ring-content">
            <div id="burnTotal" class="ring-main">0</div>
            <div class="ring-label">kcal burned</div>
            <div class="ring-sub">movement today</div>
          </div>
        </div>
      </div>
      <div id="activityEntries" class="entries"></div>
    </article>
  </section>

  <button id="closeDay" class="close-btn" type="button">Close the day</button>
  <div id="closedBanner" class="closed-banner">Day closed. Today's entries are locked.</div>
</main>
<script>
(() => {
  'use strict';
  const GOAL = 1100;
  const STORAGE_KEY = 'sane_weight_management_v1';
  let selected = 'today';

  const $ = (id) => document.getElementById(id);
  const els = {
    datePicker: $('datePicker'), todayBtn: $('todayBtn'), yesterdayBtn: $('yesterdayBtn'), viewNote: $('viewNote'),
    mealToggle: $('mealToggle'), mealForm: $('mealForm'), mealName: $('mealName'), mealCal: $('mealCal'),
    foodRing: $('foodRing'), foodTotal: $('foodTotal'), foodRemaining: $('foodRemaining'), mealEntries: $('mealEntries'),
    waterRow: $('waterRow'), waterStatus: $('waterStatus'),
    activityToggle: $('activityToggle'), activityForm: $('activityForm'), activityName: $('activityName'), activityCal: $('activityCal'),
    burnRing: $('burnRing'), burnTotal: $('burnTotal'), activityEntries: $('activityEntries'),
    closeDay: $('closeDay'), closedBanner: $('closedBanner')
  };

  function localDateKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  function yesterdayKey() {
    const d = new Date(); d.setDate(d.getDate()-1); return localDateKey(d);
  }
  function blankDay(date) { return { date, meals: [], activities: [], water: 0, closed: false }; }
  function load() {
    const today = localDateKey();
    const yday = yesterdayKey();
    let s;
    try { s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { s = null; }
    if (!s || !s.today) s = { today: blankDay(today), yesterday: blankDay(yday) };
    if (s.today.date !== today) {
      const previousToday = s.today;
      s.yesterday = previousToday.date === yday ? previousToday : blankDay(yday);
      s.today = blankDay(today);
    }
    if (!s.yesterday || s.yesterday.date !== yday) s.yesterday = blankDay(yday);
    sanitize(s.today); sanitize(s.yesterday);
    save(s);
    return s;
  }
  function sanitize(day) {
    day.meals = Array.isArray(day.meals) ? day.meals.slice(-50) : [];
    day.activities = Array.isArray(day.activities) ? day.activities.slice(-50) : [];
    day.water = Math.max(0, Math.min(8, Number(day.water)||0));
    day.closed = !!day.closed;
  }
  function save(s = state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({today:s.today, yesterday:s.yesterday})); } catch (e) { console.warn('Storage unavailable', e); }
  }
  let state = load();

  function fmtDate(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Intl.DateTimeFormat(undefined, { weekday:'long', day:'numeric', month:'short', year:'numeric' }).format(new Date(y,m-1,d));
  }
  function sum(list) { return list.reduce((n, x) => n + (Number(x.calories)||0), 0); }
  function currentDay() { return selected === 'today' ? state.today : state.yesterday; }
  function isEditable() { return selected === 'today' && !state.today.closed; }
  function setRing(el, pct) { el.style.setProperty('--pct', Math.max(0, Math.min(100, pct))); }

  function render() {
    state = load();
    const day = currentDay();
    const edit = isEditable();
    const today = localDateKey(), yday = yesterdayKey();
    els.datePicker.min = yday; els.datePicker.max = today; els.datePicker.value = day.date;
    els.todayBtn.classList.toggle('active', selected === 'today');
    els.yesterdayBtn.classList.toggle('active', selected === 'yesterday');
    els.viewNote.textContent = selected === 'today' ? `Today • ${fmtDate(day.date)}` : `Yesterday • ${fmtDate(day.date)} • view only`;

    const eaten = sum(day.meals);
    const remaining = GOAL - eaten;
    els.foodTotal.textContent = `${eaten}/${GOAL}`;
    els.foodRemaining.textContent = remaining >= 0 ? `${remaining.toLocaleString()} left` : `${Math.abs(remaining).toLocaleString()} over`;
    setRing(els.foodRing, (eaten / GOAL) * 100);
    const foodColor = eaten > GOAL ? 'var(--danger)' : eaten >= GOAL * .8 ? 'var(--warn)' : 'var(--accent)';
    els.foodRing.style.setProperty('--ring-color', foodColor);

    const burned = sum(day.activities);
    els.burnTotal.textContent = burned.toLocaleString();
    setRing(els.burnRing, Math.min(100, (burned / 500) * 100));

    els.mealToggle.disabled = !edit;
    els.activityToggle.disabled = !edit;
    els.mealToggle.classList.toggle('hidden', selected === 'yesterday');
    els.activityToggle.classList.toggle('hidden', selected === 'yesterday');
    if (!edit) { els.mealForm.classList.remove('show'); els.activityForm.classList.remove('show'); }

    renderEntries(els.mealEntries, day.meals, 'meal');
    renderEntries(els.activityEntries, day.activities, 'activity');
    renderWater(day.water, edit);

    const showTodayControls = selected === 'today';
    els.closeDay.classList.toggle('hidden', !showTodayControls);
    els.closedBanner.classList.toggle('show', showTodayControls && state.today.closed);
    if (showTodayControls) {
      els.closeDay.textContent = state.today.closed ? 'Day Closed' : 'Close the day';
      els.closeDay.classList.toggle('closed', state.today.closed);
      els.closeDay.disabled = state.today.closed;
    }
  }

  function renderEntries(container, list, type) {
    container.innerHTML = '';
    if (selected === 'yesterday') return;
    if (!list.length) { container.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    list.forEach((item, index) => {
      const row = document.createElement('div'); row.className = 'entry';
      const name = document.createElement('div'); name.className = 'entry-name'; name.textContent = item.name;
      const right = document.createElement('div'); right.className = 'entry-right';
      const cal = document.createElement('span'); cal.textContent = `${item.calories} kcal`;
      right.appendChild(cal);
      if (isEditable()) {
        const del = document.createElement('button'); del.type='button'; del.className='delete'; del.textContent='×'; del.title='Delete';
        del.addEventListener('click', () => {
          const arr = type === 'meal' ? state.today.meals : state.today.activities;
          arr.splice(index,1); save(); render();
        });
        right.appendChild(del);
      }
      row.append(name,right); container.appendChild(row);
    });
  }

  function renderWater(count, edit) {
    els.waterRow.innerHTML='';
    for (let i=0;i<8;i++) {
      const g=document.createElement('div');
      g.className='glass' + (i < count ? ' full' : '') + (!edit ? ' locked' : '');
      g.setAttribute('role','button'); g.setAttribute('aria-label',`Glass ${i+1}`);
      if (edit) g.addEventListener('click', () => {
        state.today.water = (i + 1 === state.today.water) ? i : i + 1;
        save(); render();
      });
      els.waterRow.appendChild(g);
    }
    els.waterStatus.textContent = `${count}/8 glasses`;
  }

  function addItem(kind, name, calories) {
    const cleanName = String(name || '').trim();
    const cal = Number(calories);
    if (!cleanName || !Number.isInteger(cal) || cal < 0) return;
    if (!isEditable()) return;
    const obj = { name: cleanName, calories: cal, time: Date.now() };
    if (kind === 'meal') state.today.meals.push(obj); else state.today.activities.push(obj);
    save(); render();
  }

  els.mealToggle.addEventListener('click', () => { if (isEditable()) { els.mealForm.classList.toggle('show'); if (els.mealForm.classList.contains('show')) els.mealName.focus(); } });
  els.activityToggle.addEventListener('click', () => { if (isEditable()) { els.activityForm.classList.toggle('show'); if (els.activityForm.classList.contains('show')) els.activityName.focus(); } });
  els.mealForm.addEventListener('submit', (e) => { e.preventDefault(); addItem('meal', els.mealName.value, Number(els.mealCal.value)); e.target.reset(); els.mealForm.classList.remove('show'); });
  els.activityForm.addEventListener('submit', (e) => { e.preventDefault(); addItem('activity', els.activityName.value, Number(els.activityCal.value)); e.target.reset(); els.activityForm.classList.remove('show'); });

  els.todayBtn.addEventListener('click', () => { selected='today'; render(); });
  els.yesterdayBtn.addEventListener('click', () => { selected='yesterday'; render(); });
  els.datePicker.addEventListener('change', () => {
    if (els.datePicker.value === localDateKey()) selected='today';
    else if (els.datePicker.value === yesterdayKey()) selected='yesterday';
    else selected='today';
    render();
  });

  els.closeDay.addEventListener('click', () => {
    if (state.today.closed) return;
    if (confirm('Close today? Meals, water, and activities will be locked until tomorrow.')) {
      state.today.closed = true; save(); render();
    }
  });

  // If the page stays open across midnight, rotate to a fresh day automatically.
  let lastDate = localDateKey();
  setInterval(() => {
    const now = localDateKey();
    if (now !== lastDate) { lastDate = now; selected='today'; state = load(); render(); }
  }, 30000);

  render();
})();
</script>
</body>
</html>
