<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#07111f">

<title>Sane's Personalized Weight Management</title>


<style>

:root {

  --text:#f8fbff;

  --muted:#b9c7d8;

  --line:rgba(255,255,255,.15);

  --card:rgba(5,13,25,.78);

  --green:#63e08e;

  --yellow:#ffc857;

  --red:#ff5f70;

  --blue:#55c7ff;

}


* {

  box-sizing:border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body {

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:
    var(--text);

  background:
    #07111f;

}


body {

  min-height:
    100vh;

  min-height:
    100dvh;


  /*
    Put your background image
    in the same GitHub folder
    as index.html.

    Filename:
    sane_weight_background.jpg
  */

  background-image:

    linear-gradient(
      180deg,
      rgba(3,9,18,.34),
      rgba(3,9,18,.69) 44%,
      rgba(3,9,18,.90)
    ),

    url("sane_weight_background.jpg");


  background-size:
    cover;

  background-position:
    center 22%;

  background-repeat:
    no-repeat;

}


button,
input {

  font:
    inherit;

}



/* =================================
   MAIN SCREEN
   ================================= */

.app {

  width:
    min(100%,520px);

  height:
    100vh;

  height:
    100dvh;

  margin:
    0 auto;


  padding:

    max(
      5px,
      env(safe-area-inset-top)
    )

    10px

    max(
      6px,
      env(safe-area-inset-bottom)
    );


  display:grid;


  grid-template-rows:

    auto
    minmax(0,1fr)
    auto;


  gap:
    6px;

}



/* =================================
   TITLE
   ================================= */

header {

  min-height:
    0;

}


h1 {

  margin:
    0;

  padding:
    0;

  text-align:
    center;

  font-size:
    clamp(
      1rem,
      4.2vw,
      1.28rem
    );

  line-height:
    1.05;

  font-weight:
    800;

  white-space:
    nowrap;

  text-shadow:

    0 2px 12px
    rgba(0,0,0,.65);

}



/* =================================
   DATE / TODAY / YESTERDAY
   ================================= */

.date-row {

  display:grid;

  grid-template-columns:

    .82fr
    1.1fr
    1.1fr;


  gap:
    5px;

  margin-top:
    5px;

}


.date-label,
.tab {

  min-height:
    33px;

  padding:
    5px 7px;

  border:

    1px solid
    var(--line);

  border-radius:
    12px;


  background:

    rgba(
      5,
      13,
      25,
      .80
    );


  color:
    white;


  font-size:
    .81rem;

  font-weight:
    850;

  cursor:
    pointer;

}


.tab.active {

  background:
    white;

  color:
    #07111f;

}


#datePicker {

  position:
    fixed;

  left:
    -9999px;

  width:
    1px;

  height:
    1px;

  opacity:
    0;

}



/* =================================
   PANELS AREA
   ================================= */

.panels {

  min-height:
    0;


  display:grid;


  grid-template-rows:

    minmax(0,1fr)

    auto

    minmax(0,1fr);


  gap:
    6px;

}



/* =================================
   CARD
   ================================= */

.card {

  min-height:
    0;

  overflow:
    hidden;


  padding:
    9px 11px;


  border:

    1px solid
    var(--line);


  border-radius:
    18px;


  background:
    var(--card);


  backdrop-filter:
    blur(12px);


  -webkit-backdrop-filter:
    blur(12px);


  box-shadow:

    0 10px 30px
    rgba(0,0,0,.24);

}


.card-head {

  display:flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

  min-height:
    29px;

}


.card h2 {

  margin:
    0;

  font-size:
    .94rem;

  line-height:
    1;

}


.add-btn {

  border:
    0;

  border-radius:
    999px;


  padding:
    6px 11px;


  background:
    white;

  color:
    #07111f;


  font-size:
    .77rem;

  font-weight:
    900;

  cursor:
    pointer;

}


.add-btn:disabled {

  opacity:
    .35;

}



/* =================================
   BIG CIRCLE AREA
   ================================= */

.circle-area {

  height:

    calc(
      100% - 29px
    );


  min-height:
    0;


  display:flex;

  align-items:
    center;

  justify-content:
    center;

}



/* =================================
   CIRCLE
   ================================= */

.ring {

  --p:0;

  --ring:
    var(--green);


  width:

    clamp(
      116px,
      34vw,
      150px
    );


  aspect-ratio:
    1;


  flex:
    0 0 auto;


  position:
    relative;


  display:grid;

  place-items:
    center;


  border-radius:
    50%;


  background:

    conic-gradient(

      var(--ring)

      calc(
        var(--p) * 1%
      ),

      rgba(
        255,
        255,
        255,
        .11
      )

      0

    );

}


.ring::after {

  content:"";


  position:
    absolute;

  inset:
    9px;


  border-radius:
    50%;


  background:

    rgba(
      5,
      13,
      25,
      .97
    );

}


.ring-inner {

  position:
    relative;

  z-index:
    1;


  text-align:
    center;

  line-height:
    1;

}


.ring-number {

  font-size:

    clamp(
      1.45rem,
      7vw,
      2rem
    );


  font-weight:
    950;

  white-space:
    nowrap;

}


.ring-label {

  margin-top:
    7px;


  color:
    #c2cfdd;


  font-size:
    .61rem;


  font-weight:
    900;


  letter-spacing:
    .14em;

}



/* =================================
   WATER
   ================================= */

.water-card {

  padding:

    8px
    11px
    9px;

}


.water-count {

  color:
    #e1f6ff;

  font-size:
    .80rem;

  font-weight:
    900;

}


.water-row {

  display:grid;

  grid-template-columns:

    repeat(
      8,
      1fr
    );


  gap:
    6px;


  margin-top:
    7px;

}


.glass {

  position:
    relative;


  height:
    43px;


  overflow:
    hidden;


  border:

    2px solid
    rgba(
      225,
      244,
      255,
      .76
    );


  border-top:
    0;


  border-radius:

    3px
    3px
    9px
    9px;


  background:

    rgba(
      255,
      255,
      255,
      .035
    );


  cursor:
    pointer;

}


.glass::before {

  content:"";


  position:
    absolute;


  left:
    4%;

  right:
    4%;

  bottom:
    0;


  height:
    0;


  background:

    linear-gradient(

      180deg,

      #72d9ff,

      #2f9ff1

    );


  transition:

    height
    .16s ease;

}


.glass.full::before {

  height:
    82%;

}


.glass.full::after {

  content:"";


  position:
    absolute;


  left:
    10%;

  right:
    10%;


  bottom:
    74%;


  height:
    2px;


  border-radius:
    100px;


  background:

    rgba(
      240,
      253,
      255,
      .92
    );

}


.glass.locked {

  cursor:
    default;

  opacity:
    .75;

}



/* =================================
   CLOSE DAY
   ================================= */

.close-btn {

  width:
    100%;


  min-height:
    38px;


  border:

    1px solid
    var(--line);


  border-radius:
    13px;


  background:

    rgba(
      6,
      14,
      25,
      .91
    );


  color:
    white;


  font-size:
    .83rem;

  font-weight:
    950;


  cursor:
    pointer;

}


.close-btn.closed {

  opacity:
    .55;

}


.hidden {

  display:
    none !important;

}



/* =================================
   ADD MEAL / ACTIVITY POPUP
   ================================= */

.modal {

  position:
    fixed;

  inset:
    0;


  z-index:
    100;


  display:
    none;


  align-items:
    center;

  justify-content:
    center;


  padding:
    18px;


  background:

    rgba(
      0,
      0,
      0,
      .62
    );

}


.modal.show {

  display:
    flex;

}


.modal-box {

  width:

    min(
      100%,
      390px
    );


  padding:
    15px;


  border:

    1px solid
    rgba(
      255,
      255,
      255,
      .18
    );


  border-radius:
    18px;


  background:
    #0a1625;


  box-shadow:

    0 20px 60px
    rgba(
      0,
      0,
      0,
      .55
    );

}


.modal-box h3 {

  margin:

    0
    0
    11px;


  font-size:
    1rem;

}


.form-row {

  display:grid;


  grid-template-columns:

    1.25fr
    .75fr;


  gap:
    8px;

}


.form-row input {

  width:
    100%;


  min-width:
    0;


  border:

    1px solid
    rgba(
      255,
      255,
      255,
      .15
    );


  border-radius:
    11px;


  background:
    #101f31;


  color:
    white;


  padding:
    10px;


  outline:
    none;

}


.modal-actions {

  display:grid;


  grid-template-columns:

    1fr
    1fr;


  gap:
    8px;


  margin-top:
    10px;

}


.modal-actions button {

  min-height:
    38px;


  border:
    0;


  border-radius:
    11px;


  font-weight:
    900;


  cursor:
    pointer;

}


.cancel {

  background:
    #253448;

  color:
    white;

}


.save {

  background:
    white;

  color:
    #07111f;

}



/* =================================
   SHORTER PHONES
   ================================= */

@media
(max-height:760px) {

  .app {

    gap:
      4px;


    padding-top:
      4px;


    padding-bottom:
      4px;

  }


  h1 {

    font-size:
      .96rem;

  }


  .date-row {

    margin-top:
      3px;

    gap:
      4px;

  }


  .date-label,
  .tab {

    min-height:
      29px;


    padding:
      4px 6px;


    font-size:
      .73rem;

  }


  .panels {

    gap:
      4px;

  }


  .card {

    padding:
      7px 9px;


    border-radius:
      15px;

  }


  .card-head {

    min-height:
      24px;

  }


  .card h2 {

    font-size:
      .84rem;

  }


  .add-btn {

    padding:
      5px 9px;


    font-size:
      .69rem;

  }


  .circle-area {

    height:

      calc(
        100% - 24px
      );

  }


  .ring {

    width:

      clamp(
        98px,
        29vw,
        122px
      );

  }


  .ring::after {

    inset:
      7px;

  }


  .ring-number {

    font-size:
      1.35rem;

  }


  .ring-label {

    margin-top:
      5px;

    font-size:
      .55rem;

  }


  .water-row {

    gap:
      5px;


    margin-top:
      5px;

  }


  .glass {

    height:
      32px;

  }


  .close-btn {

    min-height:
      32px;


    font-size:
      .74rem;

  }

}



/* =================================
   VERY SHORT SCREEN
   ================================= */

@media
(max-height:630px) {

  h1 {

    font-size:
      .88rem;

  }


  .date-label,
  .tab {

    min-height:
      26px;

  }


  .ring {

    width:
      89px;

  }


  .ring-number {

    font-size:
      1.18rem;

  }


  .glass {

    height:
      25px;

  }


  .water-card {

    padding-top:
      5px;

    padding-bottom:
      5px;

  }


  .close-btn {

    min-height:
      28px;

  }

}

</style>

</head>



<body>


<div class="app">


<header>


<h1>
Sane's Personalized Weight Management
</h1>


<div class="date-row">


<button
  id="dateLabel"
  class="date-label"
  type="button">
27 Sep
</button>


<button
  id="todayBtn"
  class="tab active"
  type="button">
Today
</button>


<button
  id="yesterdayBtn"
  class="tab"
  type="button">
Yesterday
</button>


<input
  id="datePicker"
  type="date">


</div>

</header>





<main class="panels">



<!-- ===============================
     CALORIES
     =============================== -->

<section class="card">


<div class="card-head">


<h2>
Calories Eaten
</h2>


<button
  id="mealAdd"
  class="add-btn"
  type="button">

+ Add meal

</button>


</div>



<div class="circle-area">


<div
  id="foodRing"
  class="ring">


<div class="ring-inner">


<div
  id="foodTotal"
  class="ring-number">

0/1100

</div>


<div class="ring-label">

KCAL EATEN

</div>


</div>


</div>


</div>


</section>





<!-- ===============================
     WATER
     =============================== -->

<section
  class="card water-card">


<div class="card-head">


<h2>
Water
</h2>


<div
  id="waterCount"
  class="water-count">

0/8

</div>


</div>



<div
  id="waterRow"
  class="water-row"
  aria-label="Eight glasses of water">

</div>


</section>





<!-- ===============================
     ACTIVITY
     =============================== -->

<section class="card">


<div class="card-head">


<h2>
Activity
</h2>


<button
  id="activityAdd"
  class="add-btn"
  type="button">

+ Add activity

</button>


</div>



<div class="circle-area">


<div
  id="burnRing"
  class="ring"
  style="--ring:var(--red)">


<div class="ring-inner">


<div
  id="burnTotal"
  class="ring-number">

0

</div>


<div class="ring-label">

BURNED

</div>


</div>


</div>


</div>


</section>


</main>





<button
  id="closeDay"
  class="close-btn"
  type="button">

Close the day

</button>


</div>





<!-- ===============================
     ADD MEAL POPUP
     =============================== -->

<div
  id="mealModal"
  class="modal">


<form
  id="mealForm"
  class="modal-box">


<h3>
Add meal
</h3>


<div class="form-row">


<input
  id="mealName"
  type="text"
  maxlength="40"
  placeholder="Meal name"
  autocomplete="off"
  required>


<input
  id="mealCal"
  type="number"
  min="1"
  step="1"
  inputmode="numeric"
  placeholder="Calories"
  required>


</div>



<div class="modal-actions">


<button
  class="cancel"
  type="button"
  data-close="mealModal">

Cancel

</button>


<button
  class="save"
  type="submit">

Add

</button>


</div>


</form>


</div>





<!-- ===============================
     ACTIVITY POPUP
     =============================== -->

<div
  id="activityModal"
  class="modal">


<form
  id="activityForm"
  class="modal-box">


<h3>
Add activity
</h3>


<div class="form-row">


<input
  id="activityName"
  type="text"
  maxlength="40"
  placeholder="Activity name"
  autocomplete="off"
  required>


<input
  id="activityCal"
  type="number"
  min="1"
  step="1"
  inputmode="numeric"
  placeholder="Calories burned"
  required>


</div>



<div class="modal-actions">


<button
  class="cancel"
  type="button"
  data-close="activityModal">

Cancel

</button>


<button
  class="save"
  type="submit">

Add

</button>


</div>


</form>


</div>





<script>

(() => {

"use strict";



/* ===============================
   SETTINGS
   =============================== */

const GOAL =
  1100;


/*
  Keep same localStorage name
  so previous data survives.
*/

const STORAGE_KEY =
  "sane_weight_management_v1";


let selected =
  "today";


const $ =
  id =>
  document.getElementById(id);



const els = {

  dateLabel:
    $("dateLabel"),

  datePicker:
    $("datePicker"),

  todayBtn:
    $("todayBtn"),

  yesterdayBtn:
    $("yesterdayBtn"),


  mealAdd:
    $("mealAdd"),

  foodRing:
    $("foodRing"),

  foodTotal:
    $("foodTotal"),


  waterRow:
    $("waterRow"),

  waterCount:
    $("waterCount"),


  activityAdd:
    $("activityAdd"),

  burnRing:
    $("burnRing"),

  burnTotal:
    $("burnTotal"),


  closeDay:
    $("closeDay"),


  mealModal:
    $("mealModal"),

  mealForm:
    $("mealForm"),

  mealName:
    $("mealName"),

  mealCal:
    $("mealCal"),


  activityModal:
    $("activityModal"),

  activityForm:
    $("activityForm"),

  activityName:
    $("activityName"),

  activityCal:
    $("activityCal")

};



/* ===============================
   DATE FUNCTIONS
   =============================== */

function dateKey(
  d = new Date()
) {

  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    `${y}-${m}-${day}`
  );

}



function yesterdayKey() {

  const d =
    new Date();


  d.setDate(
    d.getDate() - 1
  );


  return dateKey(
    d
  );

}



/*
  Screen displays:
  27 Sep

  No year.
*/

function shortDate(
  key
) {

  const [y,m,d] =
    key
    .split("-")
    .map(Number);


  return new Intl.DateTimeFormat(

    undefined,

    {

      day:
        "numeric",

      month:
        "short"

    }

  ).format(

    new Date(
      y,
      m - 1,
      d
    )

  );

}



/* ===============================
   DATA
   =============================== */

function blankDay(
  key
) {

  return {

    date:
      key,

    meals:
      [],

    activities:
      [],

    water:
      0,

    closed:
      false

  };

}



function sanitizeDay(
  day,
  fallbackKey
) {


  if (
    !day ||
    typeof day !==
    "object"
  ) {

    day =
      blankDay(
        fallbackKey
      );

  }



  day.date =

    typeof day.date ===
    "string"

    ? day.date

    : fallbackKey;



  day.meals =

    Array.isArray(
      day.meals
    )

    ? day.meals.slice(
        -50
      )

    : [];



  day.activities =

    Array.isArray(
      day.activities
    )

    ? day.activities.slice(
        -50
      )

    : [];



  day.water =

    Math.max(

      0,

      Math.min(

        8,

        Number(
          day.water
        ) || 0

      )

    );



  day.closed =
    !!day.closed;


  return day;

}



function saveState(
  s = state
) {

  try {

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify({

        today:
          s.today,

        yesterday:
          s.yesterday

      })

    );

  }

  catch (_) {}

}



function loadState() {


  const today =
    dateKey();


  const yday =
    yesterdayKey();


  let s =
    null;


  try {

    s = JSON.parse(

      localStorage.getItem(
        STORAGE_KEY
      )

      ||

      "null"

    );

  }

  catch (_) {}



  if (
    !s ||
    typeof s !==
    "object"
  ) {

    s = {

      today:
        blankDay(
          today
        ),

      yesterday:
        blankDay(
          yday
        )

    };

  }



  s.today =
    sanitizeDay(

      s.today,

      today

    );


  s.yesterday =
    sanitizeDay(

      s.yesterday,

      yday

    );



  /*
    MIDNIGHT RESET
  */

  if (
    s.today.date !==
    today
  ) {


    const oldToday =
      s.today;


    s.yesterday =

      oldToday.date ===
      yday

      ? oldToday

      : blankDay(
          yday
        );


    s.today =
      blankDay(
        today
      );

  }



  if (
    s.yesterday.date !==
    yday
  ) {

    s.yesterday =
      blankDay(
        yday
      );

  }



  saveState(
    s
  );


  return s;

}



let state =
  loadState();



function currentDay() {

  return (

    selected ===
    "today"

    ? state.today

    : state.yesterday

  );

}



function editable() {

  return (

    selected ===
    "today"

    &&

    !state.today.closed

  );

}



function total(
  list
) {

  return list.reduce(

    (
      sum,
      item
    ) =>

    sum +
    (
      Number(
        item.calories
      )

      || 0
    ),

    0

  );

}



/* ===============================
   CIRCLE
   =============================== */

function setRing(
  element,
  percent,
  color
) {


  element.style.setProperty(

    "--p",

    Math.max(

      0,

      Math.min(

        100,

        percent

      )

    )

  );



  element.style.setProperty(

    "--ring",

    color

  );

}



/* ===============================
   WATER
   =============================== */

function renderWater(
  day
) {


  els.waterRow.innerHTML =
    "";


  els.waterCount.textContent =
    `${day.water}/8`;



  for (
    let i = 0;
    i < 8;
    i++
  ) {


    const glass =
      document.createElement(
        "div"
      );



    glass.className =

      "glass"

      +

      (
        i < day.water

        ? " full"

        : ""
      )

      +

      (
        !editable()

        ? " locked"

        : ""
      );



    glass.setAttribute(

      "aria-label",

      `Water glass ${i + 1}`

    );



    if (
      editable()
    ) {


      glass.addEventListener(

        "click",

        () => {


          state.today.water =

            state.today.water
            ===
            i + 1

            ? i

            : i + 1;



          saveState();


          render();

        }

      );

    }



    els.waterRow.appendChild(
      glass
    );

  }

}



/* ===============================
   RENDER
   =============================== */

function render() {


  state =
    loadState();


  const day =
    currentDay();



  els.todayBtn
    .classList
    .toggle(

      "active",

      selected ===
      "today"

    );



  els.yesterdayBtn
    .classList
    .toggle(

      "active",

      selected ===
      "yesterday"

    );



  els.dateLabel.textContent =
    shortDate(
      day.date
    );



  els.datePicker.min =
    yesterdayKey();


  els.datePicker.max =
    dateKey();


  els.datePicker.value =
    day.date;



  /* =========================
     CALORIES
     ========================= */

  const eaten =
    total(
      day.meals
    );



  els.foodTotal.textContent =
    `${eaten}/${GOAL}`;



  let foodColor =
    "var(--green)";


  if (
    eaten > GOAL
  ) {

    foodColor =
      "var(--red)";

  }

  else if (
    eaten >=
    GOAL * .80
  ) {

    foodColor =
      "var(--yellow)";

  }



  setRing(

    els.foodRing,

    (
      eaten /
      GOAL
    )
    *
    100,

    foodColor

  );



  /* =========================
     ACTIVITY
     ========================= */

  const burned =
    total(
      day.activities
    );



  els.burnTotal.textContent =
    burned;



  setRing(

    els.burnRing,

    Math.min(

      100,

      (
        burned /
        500
      )
      *
      100

    ),

    "var(--red)"

  );



  /* =========================
     WATER
     ========================= */

  renderWater(
    day
  );



  const canEdit =
    editable();



  /*
    YESTERDAY:
    show circles and water only.
  */

  els.mealAdd
    .classList
    .toggle(

      "hidden",

      selected ===
      "yesterday"

    );


  els.activityAdd
    .classList
    .toggle(

      "hidden",

      selected ===
      "yesterday"

    );


  els.closeDay
    .classList
    .toggle(

      "hidden",

      selected ===
      "yesterday"

    );



  els.mealAdd.disabled =
    !canEdit;


  els.activityAdd.disabled =
    !canEdit;



  if (
    selected ===
    "today"
  ) {


    els.closeDay.textContent =

      state.today.closed

      ? "Day Closed"

      : "Close the day";



    els.closeDay.disabled =
      state.today.closed;



    els.closeDay
      .classList
      .toggle(

        "closed",

        state.today.closed

      );

  }

}



/* ===============================
   POPUPS
   =============================== */

function openModal(
  modal,
  input
) {


  if (
    !editable()
  ) {

    return;

  }



  modal.classList.add(
    "show"
  );



  setTimeout(

    () =>
      input.focus(),

    40

  );

}



function closeModal(
  modal
) {

  modal.classList.remove(
    "show"
  );

}



function wholePositive(
  value
) {


  const n =
    Number(
      value
    );


  return (

    Number.isInteger(
      n
    )

    &&

    n > 0

  )

  ? n

  : null;

}



/* ===============================
   TODAY BUTTON
   =============================== */

els.todayBtn
  .addEventListener(

    "click",

    () => {

      selected =
        "today";


      render();

    }

  );



/* ===============================
   YESTERDAY BUTTON
   =============================== */

els.yesterdayBtn
  .addEventListener(

    "click",

    () => {

      selected =
        "yesterday";


      render();

    }

  );



/* ===============================
   DATE BUTTON
   =============================== */

els.dateLabel
  .addEventListener(

    "click",

    () => {


      if (

        typeof
        els.datePicker
          .showPicker
        ===
        "function"

      ) {

        els.datePicker
          .showPicker();

      }

      else {

        els.datePicker
          .click();

      }

    }

  );



els.datePicker
  .addEventListener(

    "change",

    () => {


      selected =

        els.datePicker.value
        ===
        yesterdayKey()

        ? "yesterday"

        : "today";


      render();

    }

  );



/* ===============================
   ADD MEAL
   =============================== */

els.mealAdd
  .addEventListener(

    "click",

    () => {


      els.mealName.value =
        "";


      els.mealCal.value =
        "";


      openModal(

        els.mealModal,

        els.mealName

      );

    }

  );



els.mealForm
  .addEventListener(

    "submit",

    event => {


      event.preventDefault();



      if (
        !editable()
      ) {

        return;

      }



      const name =
        els.mealName
        .value
        .trim();



      const calories =
        wholePositive(

          els.mealCal.value

        );



      if (
        !name
        ||
        calories ===
        null
      ) {

        return;

      }



      state.today
        .meals
        .push({

          name,
          calories

        });



      saveState();


      closeModal(
        els.mealModal
      );


      render();

    }

  );



/* ===============================
   ADD ACTIVITY
   =============================== */

els.activityAdd
  .addEventListener(

    "click",

    () => {


      els.activityName.value =
        "";


      els.activityCal.value =
        "";


      openModal(

        els.activityModal,

        els.activityName

      );

    }

  );



els.activityForm
  .addEventListener(

    "submit",

    event => {


      event.preventDefault();



      if (
        !editable()
      ) {

        return;

      }



      const name =
        els.activityName
        .value
        .trim();



      const calories =
        wholePositive(

          els.activityCal.value

        );



      if (
        !name
        ||
        calories ===
        null
      ) {

        return;

      }



      state.today
        .activities
        .push({

          name,
          calories

        });



      saveState();


      closeModal(
        els.activityModal
      );


      render();

    }

  );



/* ===============================
   CANCEL POPUPS
   =============================== */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(

    button => {


      button
        .addEventListener(

          "click",

          () => {


            closeModal(

              $(

                button
                  .dataset
                  .close

              )

            );

          }

        );

    }

  );



[
  els.mealModal,
  els.activityModal

]
.forEach(

  modal => {


    modal.addEventListener(

      "click",

      event => {


        if (
          event.target ===
          modal
        ) {

          closeModal(
            modal
          );

        }

      }

    );

  }

);



/* ===============================
   CLOSE DAY
   =============================== */

els.closeDay
  .addEventListener(

    "click",

    () => {


      if (

        selected !==
        "today"

        ||

        state.today.closed

      ) {

        return;

      }



      const yes =
        confirm(

          "Close today? Meal, water and activity will be locked until tomorrow."

        );



      if (
        !yes
      ) {

        return;

      }



      state.today.closed =
        true;


      saveState();


      render();

    }

  );



/* ===============================
   MIDNIGHT RESET
   =============================== */

let lastKnownDate =
  dateKey();



setInterval(

  () => {


    const now =
      dateKey();



    if (
      now !==
      lastKnownDate
    ) {


      lastKnownDate =
        now;


      selected =
        "today";


      state =
        loadState();


      render();

    }

  },

  30000

);



window.addEventListener(

  "focus",

  () => {


    state =
      loadState();


    render();

  }

);



/* ===============================
   START
   =============================== */

render();


})();

</script>


</body>

</html>
