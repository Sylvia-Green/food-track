<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Sane's Personalized Weight Management</title>

<style>
:root {
  --text:#f8fbff;
  --muted:#b9c7d8;
  --line:rgba(255,255,255,.15);
  --card:rgba(5,13,25,.78);
  --green:#63e08e;
  --yellow:#ffc857;
  --red:#ff5f70;
  --blue:#55c7ff;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html, body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#06101d;
}

body {
  min-height:100vh;
  min-height:100dvh;

  /*
    KEEP YOUR EXISTING PHOTO BACKGROUND HERE.

    If your current version already has the long:
    url("data:image/jpeg;base64,......")
    line, paste that same URL below instead of:
    url("sane_weight_background.jpg")

    OR put sane_weight_background.jpg in the same
    GitHub folder as index.html.
  */

  background-image:
    linear-gradient(
      180deg,
      rgba(3,9,18,.30),
      rgba(3,9,18,.72) 42%,
      rgba(3,9,18,.92)
    ),
    url("sane_weight_background.jpg");

  background-size:cover;
  background-position:center 24%;
  background-repeat:no-repeat;
}

button,
input {
  font:inherit;
}

.app {
  width:min(100%,520px);

  height:100vh;
  height:100dvh;

  margin:0 auto;

  padding:
    max(6px,env(safe-area-inset-top))
    10px
    max(7px,env(safe-area-inset-bottom));

  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:6px;
}

header {
  min-height:0;
}

h1 {
  margin:0;
  padding:0;

  font-size:clamp(1.05rem,4.6vw,1.35rem);
  line-height:1.05;

  text-align:center;

  text-shadow:
    0 2px 10px rgba(0,0,0,.55);
}


/* =========================
   DATE ROW
   ========================= */

.date-row {
  margin-top:5px;

  display:grid;

  grid-template-columns:
    minmax(68px,.75fr)
    1fr
    1fr;

  gap:5px;
  align-items:center;
}

.date-label,
.tab {
  min-height:34px;

  border:1px solid var(--line);
  border-radius:11px;

  color:white;

  background:
    rgba(5,13,25,.74);

  font-weight:800;
  font-size:.82rem;

  cursor:pointer;

  padding:6px 8px;
}

.date-label {
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tab.active {
  background:#fff;
  color:#0b1422;
}


/*
  Native date picker stays hidden.
  On screen we show only:
  27 Sep

  Not:
  27 Sep 2026
*/

#datePicker {
  position:fixed;
  left:-9999px;

  width:1px;
  height:1px;

  opacity:0;
}


/* =========================
   THREE PANELS
   ========================= */

.panels {
  min-height:0;

  display:grid;

  grid-template-rows:
    minmax(0,1fr)
    auto
    minmax(0,1fr);

  gap:6px;
}

.card {
  min-height:0;
  overflow:hidden;

  padding:9px 11px;

  border:
    1px solid var(--line);

  border-radius:17px;

  background:
    var(--card);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.24);
}

.card-head {
  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:8px;

  min-height:27px;
}

.card h2 {
  margin:0;

  font-size:.95rem;

  line-height:1;
}

.add-btn {
  border:0;

  border-radius:
    999px;

  padding:
    6px 10px;

  background:#fff;

  color:#0b1422;

  font-size:.78rem;

  font-weight:900;

  cursor:pointer;
}

.add-btn:disabled {
  opacity:.35;
}


/* =========================
   CALORIE / ACTIVITY CIRCLE
   ========================= */

.metric {
  height:
    calc(100% - 28px);

  min-height:0;

  display:grid;

  grid-template-columns:
    auto minmax(0,1fr);

  gap:12px;

  align-items:center;

  justify-content:center;
}

.ring {
  --p:0;
  --ring:var(--green);

  width:
    clamp(92px,26vw,116px);

  aspect-ratio:1;

  border-radius:50%;

  display:grid;

  place-items:center;

  position:relative;

  background:
    conic-gradient(
      var(--ring)
      calc(var(--p) * 1%),
      rgba(255,255,255,.10)
      0
    );
}

.ring::after {
  content:"";

  position:absolute;

  inset:7px;

  border-radius:50%;

  background:
    rgba(5,13,25,.94);
}

.ring-inner {
  position:relative;

  z-index:1;

  text-align:center;

  line-height:1;
}

.ring-number {
  font-weight:950;

  font-size:
    clamp(1.03rem,4.8vw,1.38rem);

  white-space:nowrap;
}

.ring-label {
  margin-top:5px;

  color:
    var(--muted);

  font-size:.60rem;

  font-weight:800;

  letter-spacing:.08em;
}

.metric-side {
  min-width:0;

  display:grid;

  align-content:center;

  gap:6px;
}


/* =========================
   LAST ITEM
   ========================= */

.last-item {
  min-height:31px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:6px;

  padding:
    6px 8px;

  border-radius:10px;

  background:
    rgba(255,255,255,.07);

  font-size:.76rem;

  color:#e7f0f8;
}

.last-text {
  overflow:hidden;

  white-space:nowrap;

  text-overflow:
    ellipsis;
}

.undo {
  flex:0 0 auto;

  width:24px;
  height:24px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.11);

  color:#fff;

  font-size:1rem;

  cursor:pointer;
}

.no-last {
  color:
    var(--muted);
}


/* =========================
   WATER
   ========================= */

.water-card {
  padding-top:8px;
  padding-bottom:8px;
}

.water-count {
  color:#dff5ff;

  font-size:.78rem;

  font-weight:900;
}

.water-row {
  display:grid;

  grid-template-columns:
    repeat(8,1fr);

  gap:6px;

  margin-top:7px;
}

.glass {
  position:relative;

  height:42px;

  border:
    2px solid
    rgba(230,247,255,.78);

  border-top:0;

  border-radius:
    3px 3px 8px 8px;

  overflow:hidden;

  cursor:pointer;

  background:
    rgba(255,255,255,.035);
}

.glass::before {
  content:"";

  position:absolute;

  left:4%;
  right:4%;
  bottom:0;

  height:0;

  background:
    linear-gradient(
      180deg,
      #75d8ff,
      #2f9ef1
    );

  transition:
    height .16s ease;
}

.glass.full::before {
  height:82%;
}

.glass.full::after {
  content:"";

  position:absolute;

  left:10%;
  right:10%;

  bottom:75%;

  height:2px;

  background:
    rgba(235,253,255,.9);

  border-radius:99px;
}

.glass.locked {
  opacity:.72;

  cursor:default;
}


/* =========================
   CLOSE DAY
   ========================= */

.close-btn {
  width:100%;

  min-height:39px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:
    rgba(7,14,25,.90);

  color:#fff;

  font-weight:950;

  font-size:.84rem;

  cursor:pointer;
}

.close-btn.closed {
  opacity:.60;
}

.hidden {
  display:none !important;
}


/* =========================
   ADD MEAL / ACTIVITY POPUP
   ========================= */

/*
  We use a popup so adding food
  does NOT make the main page taller.
*/

.modal {
  position:fixed;

  inset:0;

  z-index:50;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.58);
}

.modal.show {
  display:flex;
}

.modal-box {
  width:min(100%,390px);

  padding:15px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:18px;

  background:#0b1625;

  box-shadow:
    0 18px 60px
    rgba(0,0,0,.48);
}

.modal-box h3 {
  margin:0 0 11px;

  font-size:1rem;
}

.form-row {
  display:grid;

  grid-template-columns:
    1.25fr .75fr;

  gap:8px;
}

.form-row input {
  width:100%;

  min-width:0;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:11px;

  background:#101f31;

  color:#fff;

  padding:10px;

  outline:none;
}

.modal-actions {
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:10px;
}

.modal-actions button {
  min-height:38px;

  border:0;

  border-radius:11px;

  font-weight:900;

  cursor:pointer;
}

.cancel {
  background:#253448;

  color:#fff;
}

.save {
  background:#fff;

  color:#0b1422;
}


/* =========================
   SHORT PHONE
   ========================= */

@media (max-height:720px) {

  .app {
    gap:4px;

    padding-top:4px;

    padding-bottom:4px;
  }

  h1 {
    font-size:1rem;
  }

  .date-row {
    margin-top:3px;

    gap:4px;
  }

  .date-label,
  .tab {
    min-height:30px;

    padding:4px 7px;

    font-size:.75rem;
  }

  .panels {
    gap:4px;
  }

  .card {
    padding:7px 9px;

    border-radius:14px;
  }

  .card-head {
    min-height:23px;
  }

  .card h2 {
    font-size:.86rem;
  }

  .add-btn {
    padding:
      5px 8px;

    font-size:.70rem;
  }

  .metric {
    height:
      calc(100% - 24px);

    gap:8px;
  }

  .ring {
    width:82px;
  }

  .ring::after {
    inset:6px;
  }

  .ring-number {
    font-size:1rem;
  }

  .ring-label {
    font-size:.54rem;

    margin-top:4px;
  }

  .last-item {
    min-height:26px;

    padding:4px 7px;

    font-size:.68rem;
  }

  .undo {
    width:21px;
    height:21px;
  }

  .water-row {
    margin-top:5px;

    gap:5px;
  }

  .glass {
    height:31px;
  }

  .close-btn {
    min-height:32px;

    font-size:.76rem;

    border-radius:11px;
  }
}


@media (max-height:610px) {

  .ring {
    width:70px;
  }

  .glass {
    height:25px;
  }

  .last-item {
    min-height:22px;

    padding:
      3px 6px;
  }
}

</style>
</head>


<body>

<div class="app">

  <header>

    <h1>
      Sane's Personalized Weight Management
    </h1>

    <div class="date-row">

      <button
        id="dateLabel"
        class="date-label"
        type="button">
        27 Sep
      </button>

      <button
        id="todayBtn"
        class="tab active"
        type="button">
        Today
      </button>

      <button
        id="yesterdayBtn"
        class="tab"
        type="button">
        Yesterday
      </button>

      <input
        id="datePicker"
        type="date"
        aria-label="Choose Today or Yesterday">

    </div>

  </header>



  <main class="panels">


    <!-- =====================
         CALORIES
         ===================== -->

    <section class="card">

      <div class="card-head">

        <h2>
          Calories
        </h2>

        <button
          id="mealAdd"
          class="add-btn"
          type="button">

          + Add meal

        </button>

      </div>


      <div class="metric">


        <div
          id="foodRing"
          class="ring">

          <div class="ring-inner">

            <div
              id="foodTotal"
              class="ring-number">

              0/1100

            </div>

            <div class="ring-label">

              EATEN

            </div>

          </div>

        </div>


        <div class="metric-side">

          <div
            id="mealLast"
            class="last-item">

            <span
              class="last-text no-last">

              No meal yet

            </span>

          </div>

        </div>


      </div>

    </section>



    <!-- =====================
         WATER
         ===================== -->

    <section
      class="card water-card">

      <div class="card-head">

        <h2>
          Water
        </h2>

        <div
          id="waterCount"
          class="water-count">

          0/8

        </div>

      </div>


      <div
        id="waterRow"
        class="water-row"
        aria-label="Eight glasses of water">
      </div>


    </section>



    <!-- =====================
         ACTIVITY
         ===================== -->

    <section class="card">

      <div class="card-head">

        <h2>
          Activity
        </h2>

        <button
          id="activityAdd"
          class="add-btn"
          type="button">

          + Add activity

        </button>

      </div>


      <div class="metric">


        <div
          id="burnRing"
          class="ring"
          style="--ring:var(--red)">

          <div class="ring-inner">

            <div
              id="burnTotal"
              class="ring-number">

              0

            </div>

            <div class="ring-label">

              BURNED

            </div>

          </div>

        </div>


        <div class="metric-side">

          <div
            id="activityLast"
            class="last-item">

            <span
              class="last-text no-last">

              No activity yet

            </span>

          </div>

        </div>


      </div>

    </section>


  </main>



  <button
    id="closeDay"
    class="close-btn"
    type="button">

    Close the day

  </button>

</div>



<!-- =========================
     ADD MEAL POPUP
     ========================= -->

<div
  id="mealModal"
  class="modal"
  aria-hidden="true">

  <form
    id="mealForm"
    class="modal-box">

    <h3>
      Add meal
    </h3>


    <div class="form-row">

      <input
        id="mealName"
        type="text"
        maxlength="40"
        placeholder="Meal name"
        autocomplete="off"
        required>

      <input
        id="mealCal"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        placeholder="Calories"
        required>

    </div>


    <div class="modal-actions">

      <button
        class="cancel"
        type="button"
        data-close="mealModal">

        Cancel

      </button>


      <button
        class="save"
        type="submit">

        Add

      </button>

    </div>

  </form>

</div>



<!-- =========================
     ADD ACTIVITY POPUP
     ========================= -->

<div
  id="activityModal"
  class="modal"
  aria-hidden="true">

  <form
    id="activityForm"
    class="modal-box">

    <h3>
      Add activity
    </h3>


    <div class="form-row">

      <input
        id="activityName"
        type="text"
        maxlength="40"
        placeholder="Activity name"
        autocomplete="off"
        required>

      <input
        id="activityCal"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        placeholder="Calorie burn"
        required>

    </div>


    <div class="modal-actions">

      <button
        class="cancel"
        type="button"
        data-close="activityModal">

        Cancel

      </button>


      <button
        class="save"
        type="submit">

        Add

      </button>

    </div>

  </form>

</div>



<script>

(() => {

  "use strict";


  /* =========================
     SETTINGS
     ========================= */

  const GOAL = 1100;

  /*
    Same storage name as
    your current app.
  */

  const STORAGE_KEY =
    "sane_weight_management_v1";


  let selected = "today";


  const $ =
    id => document.getElementById(id);


  const els = {

    dateLabel:
      $("dateLabel"),

    datePicker:
      $("datePicker"),

    todayBtn:
      $("todayBtn"),

    yesterdayBtn:
      $("yesterdayBtn"),


    mealAdd:
      $("mealAdd"),

    foodRing:
      $("foodRing"),

    foodTotal:
      $("foodTotal"),

    mealLast:
      $("mealLast"),


    waterRow:
      $("waterRow"),

    waterCount:
      $("waterCount"),


    activityAdd:
      $("activityAdd"),

    burnRing:
      $("burnRing"),

    burnTotal:
      $("burnTotal"),

    activityLast:
      $("activityLast"),


    closeDay:
      $("closeDay"),


    mealModal:
      $("mealModal"),

    mealForm:
      $("mealForm"),

    mealName:
      $("mealName"),

    mealCal:
      $("mealCal"),


    activityModal:
      $("activityModal"),

    activityForm:
      $("activityForm"),

    activityName:
      $("activityName"),

    activityCal:
      $("activityCal")

  };



  /* =========================
     DATE
     ========================= */

  function dateKey(
    d = new Date()
  ) {

    const y =
      d.getFullYear();

    const m =
      String(
        d.getMonth() + 1
      ).padStart(2,"0");

    const day =
      String(
        d.getDate()
      ).padStart(2,"0");


    return (
      `${y}-${m}-${day}`
    );

  }



  function yesterdayKey() {

    const d =
      new Date();

    d.setDate(
      d.getDate() - 1
    );

    return dateKey(d);

  }



  /*
    Visible date:
    27 Sep

    No year.
  */

  function shortDate(key) {

    const [y,m,d] =
      key
      .split("-")
      .map(Number);


    return new Intl.DateTimeFormat(

      undefined,

      {
        day:"numeric",
        month:"short"
      }

    ).format(

      new Date(
        y,
        m - 1,
        d
      )

    );

  }



  /* =========================
     DATA
     ========================= */

  function blankDay(key) {

    return {

      date:key,

      meals:[],

      activities:[],

      water:0,

      closed:false

    };

  }



  function sanitizeDay(
    day,
    fallbackKey
  ) {

    if (
      !day ||
      typeof day !== "object"
    ) {

      day =
        blankDay(
          fallbackKey
        );

    }


    day.date =
      typeof day.date === "string"
      ? day.date
      : fallbackKey;


    day.meals =
      Array.isArray(day.meals)
      ? day.meals.slice(-40)
      : [];


    day.activities =
      Array.isArray(day.activities)
      ? day.activities.slice(-40)
      : [];


    day.water =
      Math.max(
        0,
        Math.min(
          8,
          Number(day.water) || 0
        )
      );


    day.closed =
      !!day.closed;


    return day;

  }



  function saveState(
    s = state
  ) {

    try {

      localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify({

          today:
            s.today,

          yesterday:
            s.yesterday

        })

      );

    }

    catch (_) {}

  }



  function loadState() {

    const today =
      dateKey();

    const yday =
      yesterdayKey();


    let s = null;


    try {

      s =
        JSON.parse(

          localStorage.getItem(
            STORAGE_KEY
          ) || "null"

        );

    }

    catch (_) {}



    if (
      !s ||
      typeof s !== "object"
    ) {

      s = {

        today:
          blankDay(today),

        yesterday:
          blankDay(yday)

      };

    }



    s.today =
      sanitizeDay(
        s.today,
        today
      );


    s.yesterday =
      sanitizeDay(
        s.yesterday,
        yday
      );



    /*
      MIDNIGHT RESET

      At midnight:
      old Today -> Yesterday
      new Today -> blank

      Only Today and Yesterday
      are remembered.
    */

    if (
      s.today.date !== today
    ) {

      const oldToday =
        s.today;


      s.yesterday =

        oldToday.date === yday

        ? oldToday

        : blankDay(yday);


      s.today =
        blankDay(today);

    }



    if (
      s.yesterday.date !== yday
    ) {

      s.yesterday =
        blankDay(yday);

    }



    saveState(s);

    return s;

  }



  let state =
    loadState();



  function currentDay() {

    return (

      selected === "today"

      ? state.today

      : state.yesterday

    );

  }



  function editable() {

    return (

      selected === "today"

      &&
      !state.today.closed

    );

  }



  function total(list) {

    return list.reduce(

      (sum,item) =>

        sum +
        (
          Number(
            item.calories
          ) || 0
        ),

      0

    );

  }



  /* =========================
     CIRCLES
     ========================= */

  function setRing(
    element,
    percent,
    color
  ) {

    element.style.setProperty(

      "--p",

      Math.max(
        0,
        Math.min(
          100,
          percent
        )
      )

    );


    if (color) {

      element.style.setProperty(

        "--ring",

        color

      );

    }

  }



  /* =========================
     LAST ENTRY
     ========================= */

  function renderLast(
    container,
    list,
    kind
  ) {

    container.innerHTML = "";


    /*
      Yesterday:
      user asked only to show
      circles + water.
    */

    if (
      selected === "yesterday"
    ) {

      container.classList.add(
        "hidden"
      );

      return;

    }


    container.classList.remove(
      "hidden"
    );



    if (
      !list.length
    ) {

      const text =
        document.createElement(
          "span"
        );


      text.className =
        "last-text no-last";


      text.textContent =

        kind === "meal"

        ? "No meal yet"

        : "No activity yet";


      container.appendChild(
        text
      );

      return;

    }



    const item =
      list[
        list.length - 1
      ];



    const text =
      document.createElement(
        "span"
      );


    text.className =
      "last-text";


    text.textContent =
      `${item.name || (
        kind === "meal"
        ? "Meal"
        : "Activity"
      )} • ${Number(
        item.calories
      ) || 0}`;


    container.appendChild(
      text
    );



    /*
      Small × removes only
      the last entry.

      This is useful when
      something was typed wrong.
    */

    if (
      editable()
    ) {

      const undo =
        document.createElement(
          "button"
        );


      undo.className =
        "undo";


      undo.type =
        "button";


      undo.title =
        "Delete last";


      undo.textContent =
        "×";


      undo.addEventListener(

        "click",

        () => {

          if (
            kind === "meal"
          ) {

            state.today
              .meals
              .pop();

          }

          else {

            state.today
              .activities
              .pop();

          }


          saveState();

          render();

        }

      );


      container.appendChild(
        undo
      );

    }

  }



  /* =========================
     8 WATER GLASSES
     ========================= */

  function renderWater(day) {

    els.waterRow.innerHTML =
      "";


    els.waterCount.textContent =
      `${day.water}/8`;



    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const glass =
        document.createElement(
          "div"
        );


      glass.className =

        "glass"

        +
        (
          i < day.water
          ? " full"
          : ""
        )

        +
        (
          !editable()
          ? " locked"
          : ""
        );


      glass.setAttribute(
        "role",
        "button"
      );


      glass.setAttribute(
        "aria-label",
        `Water glass ${i + 1}`
      );



      if (
        editable()
      ) {

        glass.addEventListener(

          "click",

          () => {

            /*
              Example:

              Click glass 4
              -> 4 glasses full.

              Click glass 4 again
              -> back to 3.
            */

            state.today.water =

              (
                state.today.water
                ===
                i + 1
              )

              ? i

              : i + 1;


            saveState();

            render();

          }

        );

      }



      els.waterRow.appendChild(
        glass
      );

    }

  }



  /* =========================
     DRAW SCREEN
     ========================= */

  function render() {

    /*
      Calling loadState()
      also checks whether
      midnight has passed.
    */

    state =
      loadState();


    const day =
      currentDay();



    els.todayBtn
      .classList
      .toggle(

        "active",

        selected === "today"

      );


    els.yesterdayBtn
      .classList
      .toggle(

        "active",

        selected === "yesterday"

      );



    els.dateLabel.textContent =
      shortDate(
        day.date
      );



    /*
      Hidden native picker
      allows only Today
      and Yesterday.
    */

    els.datePicker.min =
      yesterdayKey();


    els.datePicker.max =
      dateKey();


    els.datePicker.value =
      day.date;



    /* =====================
       FOOD
       ===================== */

    const eaten =
      total(
        day.meals
      );


    els.foodTotal.textContent =
      `${eaten}/${GOAL}`;



    let foodColor =
      "var(--green)";


    if (
      eaten > GOAL
    ) {

      foodColor =
        "var(--red)";

    }

    else if (
      eaten >=
      GOAL * 0.80
    ) {

      foodColor =
        "var(--yellow)";

    }



    setRing(

      els.foodRing,

      (
        eaten /
        GOAL
      ) * 100,

      foodColor

    );



    /* =====================
       ACTIVITY
       ===================== */

    const burned =
      total(
        day.activities
      );


    els.burnTotal.textContent =
      String(
        burned
      );


    setRing(

      els.burnRing,

      (
        burned /
        500
      ) * 100,

      "var(--red)"

    );



    /* =====================
       WATER
       ===================== */

    renderWater(
      day
    );



    /* =====================
       LAST ITEMS
       ===================== */

    renderLast(

      els.mealLast,

      day.meals,

      "meal"

    );


    renderLast(

      els.activityLast,

      day.activities,

      "activity"

    );



    const canEdit =
      editable();



    /*
      Yesterday is SHOW ONLY.
    */

    els.mealAdd
      .classList
      .toggle(

        "hidden",

        selected ===
        "yesterday"

      );


    els.activityAdd
      .classList
      .toggle(

        "hidden",

        selected ===
        "yesterday"

      );


    els.closeDay
      .classList
      .toggle(

        "hidden",

        selected ===
        "yesterday"

      );



    els.mealAdd.disabled =
      !canEdit;


    els.activityAdd.disabled =
      !canEdit;



    if (
      selected === "today"
    ) {

      els.closeDay.textContent =

        state.today.closed

        ? "Day Closed"

        : "Close the day";


      els.closeDay.disabled =
        state.today.closed;


      els.closeDay
        .classList
        .toggle(

          "closed",

          state.today.closed

        );

    }

  }



  /* =========================
     POPUPS
     ========================= */

  function openModal(
    modal,
    firstInput
  ) {

    if (
      !editable()
    ) {

      return;

    }


    modal.classList.add(
      "show"
    );


    modal.setAttribute(
      "aria-hidden",
      "false"
    );


    setTimeout(

      () =>
        firstInput.focus(),

      40

    );

  }



  function closeModal(
    modal
  ) {

    modal.classList.remove(
      "show"
    );


    modal.setAttribute(
      "aria-hidden",
      "true"
    );

  }



  function wholePositive(
    value
  ) {

    const n =
      Number(value);


    return (

      Number.isInteger(n)

      &&
      n > 0

    )

    ? n

    : null;

  }



  /* =========================
     TODAY / YESTERDAY
     ========================= */

  els.todayBtn
    .addEventListener(

      "click",

      () => {

        selected =
          "today";

        render();

      }

    );



  els.yesterdayBtn
    .addEventListener(

      "click",

      () => {

        selected =
          "yesterday";

        render();

      }

    );



  /* =========================
     DATE BUTTON
     ========================= */

  els.dateLabel
    .addEventListener(

      "click",

      () => {

        /*
          On-screen date remains
          short: 27 Sep.

          Native picker may show
          the full date while open.
        */

        if (

          typeof
          els.datePicker.showPicker
          === "function"

        ) {

          els.datePicker
            .showPicker();

        }

        else {

          els.datePicker
            .click();

        }

      }

    );



  els.datePicker
    .addEventListener(

      "change",

      () => {

        selected =

          els.datePicker.value
          ===
          yesterdayKey()

          ? "yesterday"

          : "today";


        render();

      }

    );



  /* =========================
     OPEN ADD MEAL
     ========================= */

  els.mealAdd
    .addEventListener(

      "click",

      () => {

        els.mealName.value =
          "";

        els.mealCal.value =
          "";


        openModal(

          els.mealModal,

          els.mealName

        );

      }

    );



  /* =========================
     OPEN ADD ACTIVITY
     ========================= */

  els.activityAdd
    .addEventListener(

      "click",

      () => {

        els.activityName.value =
          "";

        els.activityCal.value =
          "";


        openModal(

          els.activityModal,

          els.activityName

        );

      }

    );



  /* =========================
     SAVE MEAL
     ========================= */

  els.mealForm
    .addEventListener(

      "submit",

      event => {

        event.preventDefault();


        if (
          !editable()
        ) {

          return;

        }



        const name =
          els.mealName
          .value
          .trim();


        const calories =
          wholePositive(
            els.mealCal.value
          );



        if (
          !name
          ||
          calories === null
        ) {

          return;

        }



        state.today
          .meals
          .push({

            name:name,

            calories:calories

          });



        saveState();


        closeModal(
          els.mealModal
        );


        render();

      }

    );



  /* =========================
     SAVE ACTIVITY
     ========================= */

  els.activityForm
    .addEventListener(

      "submit",

      event => {

        event.preventDefault();


        if (
          !editable()
        ) {

          return;

        }



        const name =
          els.activityName
          .value
          .trim();


        const calories =
          wholePositive(
            els.activityCal.value
          );



        if (
          !name
          ||
          calories === null
        ) {

          return;

        }



        state.today
          .activities
          .push({

            name:name,

            calories:calories

          });



        saveState();


        closeModal(
          els.activityModal
        );


        render();

      }

    );



  /* =========================
     CANCEL POPUPS
     ========================= */

  document
    .querySelectorAll(
      "[data-close]"
    )
    .forEach(

      button => {

        button
          .addEventListener(

            "click",

            () => {

              closeModal(

                $(
                  button.dataset.close
                )

              );

            }

          );

      }

    );



  /*
    Tap outside popup
    to close it.
  */

  [
    els.mealModal,
    els.activityModal

  ].forEach(

    modal => {

      modal.addEventListener(

        "click",

        event => {

          if (
            event.target === modal
          ) {

            closeModal(
              modal
            );

          }

        }

      );

    }

  );



  /* =========================
     CLOSE DAY
     ========================= */

  els.closeDay
    .addEventListener(

      "click",

      () => {

        if (

          selected !== "today"

          ||

          state.today.closed

        ) {

          return;

        }



        const yes =
          confirm(

            "Close today? Meal, water and activity will be locked until tomorrow."

          );


        if (
          !yes
        ) {

          return;

        }



        state.today.closed =
          true;


        saveState();


        render();

      }

    );



  /* =========================
     MIDNIGHT REFRESH
     ========================= */

  let lastKnownDate =
    dateKey();



  setInterval(

    () => {

      const now =
        dateKey();


      if (
        now !==
        lastKnownDate
      ) {

        lastKnownDate =
          now;


        selected =
          "today";


        state =
          loadState();


        render();

      }

    },

    30000

  );



  /*
    Also check when user
    returns to the app.
  */

  window.addEventListener(

    "focus",

    () => {

      state =
        loadState();

      render();

    }

  );



  /* =========================
     START
     ========================= */

  render();


})();

</script>

</body>
</html>
